name: Controllo Orario Surface

on:
  schedule:
    # Esegue lo script allo scoccare di ogni ora (es. 10:00, 11:00, 12:00...)
    - cron: '0 * * * *'
  workflow_dispatch: # Permette di attivarlo a mano quando vuoi

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Accedi al codice del repository
      uses: actions/checkout@v3

    - name: Configura Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Installa i componenti necessari
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Esegui lo script di scansione
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python bot_surface.py
